<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }

        #text {
            font-size: 20px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            font-size: 18px;
            padding: 10px;
        }

        .info {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Typing Test</h2>

    <p id="text">
        Belajar mengetik dengan cepat membutuhkan latihan yang konsisten setiap hari.
    </p>

    <textarea id="input" placeholder="Mulai mengetik di sini..."></textarea>

    <div class="info">
        <span>Waktu: <span id="time">60</span> detik</span>
        <span>WPM: <span id="wpm">0</span></span>
    </div>

    <button onclick="resetTest()">Reset</button>
</div>

<script>
const text = document.getElementById("text").innerText;
const input = document.getElementById("input");
const timeDisplay = document.getElementById("time");
const wpmDisplay = document.getElementById("wpm");

let time = 60;
let timer = null;
let started = false;

input.addEventListener("input", function() {

    if (!started) {
        started = true;
        timer = setInterval(countdown, 1000);
    }

    const wordsTyped = input.value.trim().split(/\s+/).filter(w => w).length;
    const elapsed = 60 - time;

    if (elapsed > 0) {
        const wpm = Math.round(wordsTyped / elapsed * 60);
        wpmDisplay.textContent = wpm;
    }

    if (input.value === text) {
        clearInterval(timer);
        alert("Selamat! Anda selesai.");
    }
});

function countdown() {
    time--;
    timeDisplay.textContent = time;

    if (time <= 0) {
        clearInterval(timer);
        input.disabled = true;
        alert("Waktu habis!");
    }
}

function resetTest() {
    clearInterval(timer);
    time = 60;
    started = false;
    input.disabled = false;
    input.value = "";
    timeDisplay.textContent = time;
    wpmDisplay.textContent = "0";
}
</script>

</body>
</html>
